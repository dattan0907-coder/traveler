name: Build NeoForge mod

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_VERSION: 8.14.3

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Gradle (multi-mirror)
        run: |
          V="${GRADLE_VERSION}"
          URLS=(
            "https://services.gradle.org/distributions/gradle-${V}-bin.zip"
            "https://github.com/gradle/gradle-distributions/releases/download/v${V}/gradle-${V}-bin.zip"
            "https://mirrors.cloud.tencent.com/gradle/gradle-${V}-bin.zip"
          )
          ok=0
          for round in 1 2 3; do
            for u in "${URLS[@]}"; do
              echo "Trying $u"
              if curl -fsSL --retry 2 --retry-delay 5 --connect-timeout 20 -o gradle.zip "$u" && unzip -tq gradle.zip >/dev/null 2>&1; then
                ok=1; break 2
              fi
              rm -f gradle.zip
            done
            echo "All mirrors failed in round $round, waiting 30s..."
            sleep 30
          done
          [ "$ok" = 1 ] || { echo "Could not download Gradle from any mirror"; exit 1; }
          unzip -q gradle.zip -d "$HOME"
          echo "$HOME/gradle-${V}/bin" >> "$GITHUB_PATH"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: gradle build --no-daemon --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: traveler-neoforge-1.21.1
          path: build/libs/*.jar

      - name: Create release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
